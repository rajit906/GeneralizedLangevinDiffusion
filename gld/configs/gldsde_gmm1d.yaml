# configs/gldsde_gmm1d.yaml

# SDE Configuration for Generalized Langevin Diffusion
sde:
  T: 1.0
  n_steps: 1000
  gamma: 1.0
  lambda_val: 1.0
  c_val: 0.1
  M: 1.0
  beta: 8.0          # Typically 8 * sqrt(M), same as before
  p_init_var: 1.0
  s_init_var: 1.0

# Model Configuration
model:
  name: 'mlp'
  data_dim: 1        # <---- 1D GMM
  ps_dim: 2          # (p,s) both scalars for 1D, so dimension = 2

  # ResNet score model parameters
  input_dim: ${model.ps_dim}
  index_dim: 1
  hidden_dim: 128
  n_hidden_layers: 4

# Training Configuration
training:
  lr: 1.0e-3
  n_epochs: 25
  ema_decay: 0.999
  n_val_steps: 500
  n_plot_samples: 500
  n_steps_per_epoch: 36
  val_every_n_epoch: 5
  batch_size: 128

# Data Configuration (1D GMM parameters)
data:
  n_points: 5000
  means: [[-10.], [10.]]  
  stds:  [[1.],  [1.]]  
  weights: [0.5, 0.5]

# WandB Logging
wandb:
  project: "gmm1d"
  entity: "rajit906"
  name: "gld-mlp-gmm-1d"
  log_model: True
